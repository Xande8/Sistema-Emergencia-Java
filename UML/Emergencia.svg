link MedicamentoControlado to Medicamento--><path d="M356.66,278.8031 C340.66,300.0631 320.1,327.4031 301.88,351.6131 " fill="none" id="MedicamentoControlado-&gt;Medicamento" style="stroke: #A80036; stroke-width: 1.0;"/><polygon fill="none" points="307.35,355.9931,289.73,367.7631,296.16,347.5731,307.35,355.9931" style="stroke: #A80036; stroke-width: 1.0;"/><!--MD5=[c750337859adc34028de67fad2fd2544]
@startuml Emergencia

title Sistema de Emergência - Diagrama de Classes

class Paciente {
    - cpf : String
    - nome : String
    - listaAtendimento : List<Atendimento>
}

class Atendimento {
    - id : int
    - data : String
    - paciente : Paciente
    - listaMedicamento : List<Medicamento>
}

class Medicamento {
    - id : int
    - nome : String
    - listaAtendimento : List<Atendimento>
}

class MedicamentoControlado {
    - crm : String
    + getCrm() : String
}

Paciente "1" - - "0..*" Atendimento : possui
Atendimento "0..*" - - "0..*" Medicamento : utiliza
MedicamentoControlado - -|> Medicamento

@enduml

